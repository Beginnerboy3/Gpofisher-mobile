          package com.example.gpofisher

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val reqProjection = 1

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 0)
                  }

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 80, 48, 48)
                  }
                  fun add(t: String, onClick: () -> Unit) {
                      col.addView(Button(this).apply {
                          text = t
                          isAllCaps = false
                          setOnClickListener { onClick() }
                      }, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  col.addView(TextView(this).apply {
                      textSize = 20f
                      text = "GPO Fisher"
                  })
                  col.addView(TextView(this).apply {
                      textSize = 14f
                      setPadding(0, 16, 0, 24)
                      text = "Do steps 1-3 once. Then open Roblox/GPO and use the floating panel.\n\n" +
                          "Android 13+: if step 1 is greyed out, open App info > (...) menu > " +
                          "\"Allow restricted settings\", then try again.\n\n" +
                          "EMERGENCY STOP: while it is running, press VOLUME DOWN (or tap STOP ALL on the panel). " +
                          "After updating the app, turn the GPO Fisher accessibility service off and on again."
                  })

                  add("1. Enable accessibility service (GPO Fisher)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  add("2. Allow display over other apps") {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  }
                  add("3. Start floating panel (asks for screen capture)") {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Do step 2 first", Toast.LENGTH_SHORT).show()
                      } else {
                          val mpm = getSystemService(MediaProjectionManager::class.java)
                          startActivityForResult(mpm.createScreenCaptureIntent(), reqProjection)
                      }
                  }
                  add("Stop floating panel") { stopService(Intent(this, FloatingService::class.java)) }

                  setContentView(ScrollView(this).apply { addView(col) })
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqProjection && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, FloatingService::class.java)
                          .putExtra("code", resultCode)
                          .putExtra("data", data)
                      startForegroundService(i)
                      Toast.makeText(this, "Panel started. Switch to the game.", Toast.LENGTH_LONG).show()
                  }
              }
          }
